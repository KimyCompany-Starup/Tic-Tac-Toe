name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      # 1. Ejecutar el build en la nube de Expo
      - name: Build en la Nube de Expo
        run: eas build --platform android --non-interactive --profile production --output ./app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Nota: Si tu proyecto requiere configuraciones adicionales, 
          # eas.json se encarga de todo en la nube.

      # 2. Publicar la Release en GitHub
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "APK generado automáticamente en la nube de Expo."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}