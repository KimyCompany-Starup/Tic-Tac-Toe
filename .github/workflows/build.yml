name: Build APK and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --- AUMENTAR MEMORIA PARA GRADLE ---
      # Esto evita el error OutOfMemory al compilar en GitHub
      - name: Create Gradle Properties
        run: |
          mkdir -p android/gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" > android/gradle.properties

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      # --- COMPILACIÓN LOCAL CON MEMORIA OPTIMIZADA ---
      - name: Build APK Local
        run: |
          eas build --platform android --profile production --local --non-interactive --output ./Tic-Tac-Toe.apk
        env:
          EAS_NO_VCS: 1
          NODE_ENV: production

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: Tic-Tac-Toe.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Versión ${{ github.ref_name }} generada automáticamente por GitHub Actions."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}