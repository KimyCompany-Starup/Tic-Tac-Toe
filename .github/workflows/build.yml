name: Build APK and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --- ACTUALIZAR VERSIÓN EN APP.JSON (COMPATIBLE CON WINDOWS/POWERSHELL) ---
      - name: Update version in app.json
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $newVersion = $tag.Replace("v", "")
          Write-Output "Actualizando app.json a la versión: $newVersion"
          $json = Get-Content app.json -Raw | ConvertFrom-Json
          $json.version = $newVersion
          $json | ConvertTo-Json -Depth 10 | Set-Content app.json

      # --- CONFIGURAR EXPO Y EAS ---
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --- INSTALAR DEPENDENCIAS ---
      - name: Install dependencies
        run: npm install

      # --- COMPILACIÓN LOCAL EN TU PC ---
      - name: Build APK Local
        shell: powershell
        run: |
          eas build --platform android --profile production --local --non-interactive --output ./Tic-Tac-Toe.apk
        env:
          EAS_NO_VCS: 1
          NODE_ENV: production

      # --- CREACIÓN DE LA RELEASE EN GITHUB ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: Tic-Tac-Toe.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Versión ${{ github.ref_name }} generada automáticamente por tu PC (Self-Hosted Runner)."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}